<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8a9a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="830" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1c3550">Схема данных конфигурации</text>

  <!-- ================= справочники ================= -->
  <g>
    <rect x="30" y="60" width="220" height="58" rx="7" fill="#eaf2fb" stroke="#4a76a8" stroke-width="1.5"/>
    <text x="44" y="82" font-size="11" fill="#5b7ba6">Справочник</text>
    <text x="44" y="103" font-size="15" font-weight="600" fill="#1c3550">Номенклатура</text>
  </g>
  <g>
    <rect x="290" y="60" width="220" height="58" rx="7" fill="#eaf2fb" stroke="#4a76a8" stroke-width="1.5"/>
    <text x="304" y="82" font-size="11" fill="#5b7ba6">Справочник</text>
    <text x="304" y="103" font-size="15" font-weight="600" fill="#1c3550">Контрагенты</text>
  </g>
  <g>
    <rect x="550" y="60" width="220" height="58" rx="7" fill="#eaf2fb" stroke="#4a76a8" stroke-width="1.5"/>
    <text x="564" y="82" font-size="11" fill="#5b7ba6">Справочник</text>
    <text x="564" y="103" font-size="15" font-weight="600" fill="#1c3550">Склады</text>
  </g>

  <!-- ================= связи справочников с документами ================= -->
  <g stroke="#7b8a9a" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <path d="M 130 118 L 190 190"/>
    <path d="M 200 118 L 300 190"/>
    <path d="M 390 118 L 260 190"/>
    <path d="M 420 118 L 520 190"/>
    <path d="M 660 118 L 350 190"/>
    <path d="M 700 118 L 590 190"/>
  </g>

  <!-- ================= документы ================= -->
  <g>
    <rect x="60" y="195" width="330" height="185" rx="7" fill="#eef7ee" stroke="#4e8a52" stroke-width="1.5"/>
    <text x="74" y="217" font-size="11" fill="#4e8a52">Документ</text>
    <text x="74" y="238" font-size="15" font-weight="600" fill="#1c3550">Приходная накладная</text>
    <text x="74" y="262" font-size="12" fill="#33475b">Контрагент, Склад, СуммаДокумента</text>
    <line x1="74" y1="272" x2="376" y2="272" stroke="#c4dcc4" stroke-width="1"/>
    <text x="74" y="292" font-size="12" font-weight="600" fill="#33475b">Товары</text>
    <text x="74" y="312" font-size="12" fill="#33475b">Номенклатура, Количество,</text>
    <text x="74" y="330" font-size="12" fill="#33475b">Цена, Сумма</text>
    <text x="74" y="358" font-size="11" fill="#4e8a52">Проведение: приход</text>
  </g>
  <g>
    <rect x="510" y="195" width="330" height="185" rx="7" fill="#eef7ee" stroke="#4e8a52" stroke-width="1.5"/>
    <text x="524" y="217" font-size="11" fill="#4e8a52">Документ</text>
    <text x="524" y="238" font-size="15" font-weight="600" fill="#1c3550">Расходная накладная</text>
    <text x="524" y="262" font-size="12" fill="#33475b">Контрагент, Склад, СуммаДокумента</text>
    <line x1="524" y1="272" x2="826" y2="272" stroke="#c4dcc4" stroke-width="1"/>
    <text x="524" y="292" font-size="12" font-weight="600" fill="#33475b">Товары</text>
    <text x="524" y="312" font-size="12" fill="#33475b">Номенклатура, Количество,</text>
    <text x="524" y="330" font-size="12" fill="#33475b">Цена, Сумма</text>
    <text x="524" y="358" font-size="11" fill="#4e8a52">Проведение: расход + контроль остатков</text>
  </g>

  <!-- ================= документы -> регистр ================= -->
  <g stroke="#7b8a9a" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <path d="M 225 380 L 330 455"/>
    <path d="M 675 380 L 570 455"/>
  </g>
  <text x="248" y="425" font-size="11" fill="#7b8a9a">движения</text>
  <text x="560" y="425" font-size="11" fill="#7b8a9a">движения</text>

  <!-- ================= регистр ================= -->
  <g>
    <rect x="270" y="460" width="360" height="150" rx="7" fill="#fdf3e6" stroke="#c08a3e" stroke-width="1.5"/>
    <text x="284" y="482" font-size="11" fill="#a9742c">Регистр накопления (вид — остатки)</text>
    <text x="284" y="504" font-size="15" font-weight="600" fill="#1c3550">Остатки товаров</text>
    <line x1="284" y1="514" x2="616" y2="514" stroke="#ecd6b6" stroke-width="1"/>
    <text x="284" y="534" font-size="12" font-weight="600" fill="#33475b">Измерения</text>
    <text x="284" y="552" font-size="12" fill="#33475b">Номенклатура, Склад</text>
    <text x="284" y="574" font-size="12" font-weight="600" fill="#33475b">Ресурс</text>
    <text x="284" y="592" font-size="12" fill="#33475b">Количество (15.3)</text>
  </g>

  <!-- ================= регистр -> отчёт ================= -->
  <g stroke="#7b8a9a" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <path d="M 450 610 L 450 685"/>
  </g>
  <text x="462" y="652" font-size="11" fill="#7b8a9a">данные</text>

  <!-- ================= отчёт ================= -->
  <g>
    <rect x="270" y="690" width="360" height="100" rx="7" fill="#f0edf9" stroke="#6b57a8" stroke-width="1.5"/>
    <text x="284" y="712" font-size="11" fill="#6b57a8">Отчёт на СКД</text>
    <text x="284" y="734" font-size="15" font-weight="600" fill="#1c3550">Остатки товаров</text>
    <line x1="284" y1="744" x2="616" y2="744" stroke="#d8d0ee" stroke-width="1"/>
    <text x="284" y="764" font-size="12" fill="#33475b">Параметры: Период, Склад</text>
    <text x="284" y="782" font-size="12" fill="#33475b">Группировка по складу, строки — номенклатура</text>
  </g>

  <!-- ================= легенда ================= -->
  <g font-size="11" fill="#5b6b7b">
    <rect x="30" y="808" width="12" height="12" rx="3" fill="#eaf2fb" stroke="#4a76a8"/>
    <text x="48" y="818">справочник</text>
    <rect x="130" y="808" width="12" height="12" rx="3" fill="#eef7ee" stroke="#4e8a52"/>
    <text x="148" y="818">документ</text>
    <rect x="220" y="808" width="12" height="12" rx="3" fill="#fdf3e6" stroke="#c08a3e"/>
    <text x="238" y="818">регистр</text>
    <rect x="300" y="808" width="12" height="12" rx="3" fill="#f0edf9" stroke="#6b57a8"/>
    <text x="318" y="818">отчёт</text>
  </g>
</svg>
